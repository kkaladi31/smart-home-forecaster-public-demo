<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="588" height="500" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#1f2937">Main Floor — Synthetic Sample Plan</text>
  <text x="20" y="52" font-size="12" fill="#6b7280">demo-002 · 2,340 sq ft · illustrative only (not a real builder plan)</text>

  <!-- outer footprint -->
  <rect x="20" y="60" width="528" height="384" fill="none" stroke="#111827" stroke-width="4"/>

  <!-- rooms -->
  <g stroke="#374151" stroke-width="2">
    <rect x="20"  y="60"  width="216" height="120" fill="#eef2ff"/>
    <rect x="20"  y="180" width="216" height="264" fill="#f1f5f9"/>
    <rect x="236" y="60"  width="312" height="180" fill="#ecfdf5"/>
    <rect x="236" y="240" width="168" height="204" fill="#fef9c3"/>
    <rect x="404" y="240" width="144" height="204" fill="#ffedd5"/>
  </g>

  <!-- room labels -->
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="128" y="112">Entry / Stairs</text>
    <text x="128" y="132" font-size="11" fill="#6b7280">18' x 10'</text>
    <text x="128" y="304">Garage</text>
    <text x="128" y="324" font-size="11" fill="#6b7280">18' x 22'</text>
    <text x="392" y="144">Great Room</text>
    <text x="392" y="164" font-size="11" fill="#6b7280">26' x 15'</text>
    <text x="320" y="336">Kitchen</text>
    <text x="320" y="356" font-size="11" fill="#6b7280">14' x 17'</text>
    <text x="476" y="336">Dining</text>
    <text x="476" y="356" font-size="11" fill="#6b7280">12' x 17'</text>
  </g>

  <!-- mudroom: the cold-climate room the Dallas plan does not have -->
  <rect x="182" y="186" width="54" height="48" fill="#e0e7ff" stroke="#374151" stroke-width="1.5"/>
  <text x="209" y="206" font-size="10" fill="#111827" text-anchor="middle">Mud</text>
  <text x="209" y="219" font-size="10" fill="#111827" text-anchor="middle">Room</text>

  <!-- half bath marker -->
  <rect x="236" y="186" width="56" height="48" fill="#e0e7ff" stroke="#374151" stroke-width="1.5"/>
  <text x="264" y="215" font-size="10" fill="#111827" text-anchor="middle">½ Bath</text>

  <!-- basement stair callout: relevant to the sump pump and egress notes -->
  <rect x="20" y="60" width="70" height="120" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <text x="55" y="112" font-size="10" fill="#111827" text-anchor="middle">Stair to</text>
  <text x="55" y="125" font-size="10" fill="#111827" text-anchor="middle">Basement</text>

  <!-- door openings (gaps drawn as white ticks) -->
  <g stroke="#ffffff" stroke-width="5">
    <line x1="236" y1="120" x2="236" y2="160"/>
    <line x1="128" y1="180" x2="168" y2="180"/>
    <line x1="404" y1="300" x2="404" y2="344"/>
  </g>

  <!-- north arrow + scale. North eave is the ice-dam-prone one in the profile. -->
  <g transform="translate(505,404)">
    <line x1="0" y1="20" x2="0" y2="0" stroke="#111827" stroke-width="2"/>
    <polygon points="0,-6 -5,4 5,4" fill="#111827"/>
    <text x="0" y="34" font-size="11" fill="#111827" text-anchor="middle">N</text>
  </g>
  <g transform="translate(20,466)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#111827" stroke-width="2"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#111827" stroke-width="2"/>
    <text x="60" y="18" font-size="11" fill="#6b7280" text-anchor="middle">scale: 10 ft</text>
  </g>
  <text x="568" y="492" font-size="10" fill="#9ca3af" text-anchor="end">SYNTHETIC — generated for capstone demo</text>
</svg>
