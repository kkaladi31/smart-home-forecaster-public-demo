<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="588" height="500" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#1f2937">Main Floor — Synthetic Sample Plan</text>
  <text x="20" y="52" font-size="12" fill="#6b7280">demo-001 · 2,200 sq ft · illustrative only (not a real builder plan)</text>

  <!-- outer footprint -->
  <rect x="20" y="60" width="528" height="384" fill="none" stroke="#111827" stroke-width="4"/>

  <!-- rooms -->
  <g stroke="#374151" stroke-width="2">
    <rect x="20"  y="60"  width="240" height="132" fill="#eef2ff"/>
    <rect x="20"  y="192" width="240" height="252" fill="#f1f5f9"/>
    <rect x="260" y="60"  width="288" height="192" fill="#ecfdf5"/>
    <rect x="260" y="252" width="144" height="192" fill="#fef9c3"/>
    <rect x="404" y="252" width="144" height="192" fill="#ffedd5"/>
  </g>

  <!-- room labels -->
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="140" y="120">Foyer / Stairs</text>
    <text x="140" y="140" font-size="11" fill="#6b7280">20' x 11'</text>
    <text x="140" y="320">Garage</text>
    <text x="140" y="340" font-size="11" fill="#6b7280">20' x 21'</text>
    <text x="404" y="150">Living Room</text>
    <text x="404" y="170" font-size="11" fill="#6b7280">24' x 16'</text>
    <text x="332" y="344">Kitchen</text>
    <text x="332" y="364" font-size="11" fill="#6b7280">12' x 16'</text>
    <text x="476" y="344">Dining</text>
    <text x="476" y="364" font-size="11" fill="#6b7280">12' x 16'</text>
  </g>

  <!-- half bath marker -->
  <rect x="200" y="150" width="56" height="40" fill="#e0e7ff" stroke="#374151" stroke-width="1.5"/>
  <text x="228" y="174" font-size="10" fill="#111827" text-anchor="middle">½ Bath</text>

  <!-- door openings (gaps drawn as white ticks) -->
  <g stroke="#ffffff" stroke-width="5">
    <line x1="260" y1="150" x2="260" y2="180"/>
    <line x1="140" y1="192" x2="180" y2="192"/>
    <line x1="404" y1="320" x2="404" y2="360"/>
  </g>

  <!-- north arrow + scale -->
  <g transform="translate(505,410)">
    <line x1="0" y1="20" x2="0" y2="0" stroke="#111827" stroke-width="2"/>
    <polygon points="0,-6 -5,4 5,4" fill="#111827"/>
    <text x="0" y="34" font-size="11" fill="#111827" text-anchor="middle">N</text>
  </g>
  <g transform="translate(20,466)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#111827" stroke-width="2"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#111827" stroke-width="2"/>
    <text x="60" y="18" font-size="11" fill="#6b7280" text-anchor="middle">scale: 10 ft</text>
  </g>
  <text x="568" y="492" font-size="10" fill="#9ca3af" text-anchor="end">SYNTHETIC — generated for capstone demo</text>
</svg>
